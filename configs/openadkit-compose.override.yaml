services:
  simulator:
    init: true
    command: >-
      ros2 launch scenario_test_runner scenario_test_runner.launch.py
      record:=false
      scenario:=${OPENADKIT_SCENARIO_PATH:-/autoware/scenario-sim/scenario/yield_maneuver_demo.yaml}
      sensor_model:=sample_sensor_kit
      vehicle_model:=sample_vehicle
      initialize_duration:=90
      global_timeout:=${TIMEOUT:-3600}
      global_frame_rate:=${OPENADKIT_FRAME_RATE:-20}

  planning-control:
    init: true

  visualizer:
    init: true
