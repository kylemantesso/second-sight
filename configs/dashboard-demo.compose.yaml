name: second-sight-dashboard-demo

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: "88"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

services:
  fault-injector:
    image: second-sight-fault-injector:dev
    init: true
    environment: *ros-environment
    volumes:
      - ${SECOND_SIGHT_ROOT}/configs/scenarios/all-faults.yaml:/scenario.yaml:ro
    command: >-
      python3 /opt/second-sight/fault_injector_node.py
      --scenario /scenario.yaml
      --reset-gap-seconds 2
      --manual-control
      --manual-duration-ms 900

  second-sight:
    image: second-sight-node:dev
    init: true
    environment: *ros-environment
    volumes:
      # This is the immutable V2 bundle used for the final Arm validation.
      # The local replay remains a Mac development/demo environment; it is not
      # a substitute for the separately recorded Arm performance evidence.
      - ${SECOND_SIGHT_ROOT}/models/v2-final-arm-25tree.joblib:/model.joblib:ro
      - ${SECOND_SIGHT_ROOT}/models/v2-final-arm-25tree.metadata.json:/model.metadata.json:ro
    command: >-
      python3 /opt/second-sight/second_sight_node.py
      --model /model.joblib
      --mode hybrid
      --reset-gap-seconds 2
      --disable-source-freshness
      --dashboard-reset-control
    depends_on:
      - fault-injector

  replay:
    image: second-sight-node:dev
    init: true
    environment: *ros-environment
    volumes:
      - ${SECOND_SIGHT_ROOT}:/workspace:ro
      - ${SECOND_SIGHT_ROOT}/data/fixtures/dashboard-v2-final.jsonl:/clean.jsonl:ro
    command: >-
      python3 /workspace/components/fault_injector/replay_node.py
      /clean.jsonl
      --detection-topic /second_sight/perception/raw
      --loop
      --loop-delay 0
    depends_on:
      - second-sight

  dashboard:
    image: second-sight-dashboard:dev
    init: true
    environment: *ros-environment
    ports:
      - 8765:8765
    command: >-
      ros2 run foxglove_bridge foxglove_bridge
      --ros-args
      -p port:=8765
      -p topic_whitelist:=['^/second_sight/.*']
      -p service_whitelist:=['^$']
      -p param_whitelist:=['^$']
      -p capabilities:=['clientPublish','connectionGraph']
    depends_on:
      - replay
